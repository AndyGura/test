<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Last Stone</title>
    <meta name="description" content="Last Stone: take 1, 2 or 3 stones from a pile of 21, and whoever takes the last stone loses. Play a friend in the browser, on the Internet Computer." />
    <link rel="canonical" href="https://sqvma-nyaaa-aaaau-ahjha-cai.icp0.io/" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪨</text></svg>" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Duel Dashboard" />
    <meta property="og:title" content="Last Stone" />
    <meta property="og:description" content="Last Stone: take 1, 2 or 3 stones from a pile of 21, and whoever takes the last stone loses. Play a friend in the browser, on the Internet Computer." />
    <meta property="og:url" content="https://sqvma-nyaaa-aaaau-ahjha-cai.icp0.io/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Last Stone" />
    <meta name="twitter:description" content="Last Stone: take 1, 2 or 3 stones from a pile of 21, and whoever takes the last stone loses. Play a friend in the browser, on the Internet Computer." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Last Stone",
        "url": "https://sqvma-nyaaa-aaaau-ahjha-cai.icp0.io/",
        "description": "Last Stone: take 1, 2 or 3 stones from a pile of 21, and whoever takes the last stone loses. Play a friend in the browser, on the Internet Computer.",
        "genre": ["Board game", "Strategy"],
        "numberOfPlayers": { "@type": "QuantitativeValue", "value": 2 },
        "playMode": ["MultiPlayer"],
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <link rel="stylesheet" href="/duel-game-core.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <div class="header-title">
        <h1>Last Stone</h1>
        <a class="more-games" href="https://games.ic0.info/" target="_blank" rel="noopener">More games ↗</a>
      </div>
      <div class="session">
        <!-- LEADERBOARD:
        <button id="leaderboard-toggle" title="Leaderboard" aria-label="Leaderboard">🏆</button>
        -->
        <span class="label">Session</span>
        <code id="sid">…</code>
        <button id="new-sid" title="Play as a different session">new</button>
      </div>
    </header>

    <!-- LEADERBOARD:
    <div id="leaderboard-panel" hidden>
      <div class="leaderboard-header">
        <button id="leaderboard-back" class="ghost">← Back</button>
        <h2>🏆 Top players</h2>
      </div>
      <div id="leaderboard-body" class="leaderboard-list"></div>
    </div>
    -->

    <!-- BOTS:
    <div id="bot-challenge-panel" hidden>
      <div class="bot-challenge-header">
        <button id="bot-challenge-back" class="ghost">← Back</button>
        <h2>🤖 Bots</h2>
      </div>
      <div id="bot-challenge-body" class="bot-challenge-body"></div>
    </div>
    -->

    <p id="error" class="error" hidden></p>

    <main id="screen">
      <p class="muted">Connecting…</p>
    </main>

    <!-- BOTS:
    <div id="bot-add-panel" hidden>
      <button id="bot-add-trigger" class="ghost">Add Bot 🤖 to the open seat</button>
    </div>
    -->

    <footer>
      <p class="muted">
        Your session id is per browser tab — open a second tab to play the
        other seat. An idle game can be taken over after
        90&nbsp;seconds.
      </p>
    </footer>

    <!-- esbuild's bundle of src/app.js (see ../build.js). -->
    <script type="module" src="/app.js"></script>
  </body>
</html>
